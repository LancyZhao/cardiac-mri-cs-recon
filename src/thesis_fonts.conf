<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>/Applications/Microsoft Word.app/Contents/Resources/DFonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>宋体</family><prefer><family>SimSun</family></prefer></alias>
  <alias><family>黑体</family><prefer><family>SimHei</family></prefer></alias>
  <alias><family>Cambria Math</family><prefer><family>STIX Two Math</family></prefer></alias>
</fontconfig>
